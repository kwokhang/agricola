<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agricola — 1–2 人局 · Revised Edition (2016)</title>
<style>
  :root {
    --bg: #f4eedc;  --panel: #fdfaf0;  --ink: #33291a;  --muted: #7d6e53;
    --line: #ddd2b6; --accent: #587a3a; --accent-ink: #f5f2e4; --hover: #efe7cf;
    --occ-frame: #d7a92c; --occ-tint: #fbf3d9; --occ-ink: #6d5210;
    --min-frame: #cd7a35; --min-tint: #fbeddc; --min-ink: #7c4413;
    --maj-frame: #b05030; --maj-tint: #f9e7dc; --maj-ink: #7a3016;
    --rnd-frame: #5f8140; --rnd-tint: #eef3e0; --rnd-ink: #3c5522;
    --grass: #cfdca9; --grass-in: #a9c47a; --soil: #c9a878; --wall: #b99b6d;
    --fence: #7a5a2e; --vp-bg: #8a6d3b;
    --shadow: 0 2px 10px rgba(60, 45, 20, .2);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1f1a10; --panel: #2a2315; --ink: #ece2ca; --muted: #a59472;
      --line: #453a25; --accent: #8fb35e; --accent-ink: #1d2410; --hover: #352d1b;
      --occ-frame: #a5811f; --occ-tint: #322a12; --occ-ink: #ecd48d;
      --min-frame: #a5602a; --min-tint: #33240f; --min-ink: #eebe8d;
      --maj-frame: #96432a; --maj-tint: #331d10; --maj-ink: #e8a988;
      --rnd-frame: #5d7a3a; --rnd-tint: #232b14; --rnd-ink: #c2d99a;
      --grass: #3f5228; --grass-in: #55703a; --soil: #5b442a; --wall: #6a5436;
      --fence: #c9a86a; --vp-bg: #6f5628;
      --shadow: 0 2px 10px rgba(0, 0, 0, .55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1f1a10; --panel: #2a2315; --ink: #ece2ca; --muted: #a59472;
    --line: #453a25; --accent: #8fb35e; --accent-ink: #1d2410; --hover: #352d1b;
    --occ-frame: #a5811f; --occ-tint: #322a12; --occ-ink: #ecd48d;
    --min-frame: #a5602a; --min-tint: #33240f; --min-ink: #eebe8d;
    --maj-frame: #96432a; --maj-tint: #331d10; --maj-ink: #e8a988;
    --rnd-frame: #5d7a3a; --rnd-tint: #232b14; --rnd-ink: #c2d99a;
    --grass: #3f5228; --grass-in: #55703a; --soil: #5b442a; --wall: #6a5436;
    --fence: #c9a86a; --vp-bg: #6f5628;
    --shadow: 0 2px 10px rgba(0, 0, 0, .55);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  h1, h2, h3 { font-family: "Iowan Old Style", Palatino, Georgia, serif; margin: 0; }
  button {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { opacity: .38; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .muted { color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  header.site {
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  }
  header.site h1 { font-size: 19px; letter-spacing: .06em; }
  header.site h1 small { display: block; font-size: 11px; letter-spacing: .12em; color: var(--muted); font-family: inherit; }
  .status { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .pill {
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 11px; font-size: 12.5px; white-space: nowrap;
  }
  .pill.now { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  main { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(360px, 1.05fr) minmax(300px, .95fr); gap: 14px; padding: 14px 18px 40px; align-items: start; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
  section.box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; box-shadow: var(--shadow); }
  section.box + section.box { margin-top: 14px; }
  section.box > h2 { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 9px; }

  /* ---------- action board ---------- */
  .spaces { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
  .space {
    border: 1px solid var(--line); border-left: 4px solid var(--rnd-frame); border-radius: 8px;
    padding: 6px 8px; background: var(--bg); text-align: left; min-height: 54px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .space.base { border-left-color: var(--wall); }
  .space .nm { font-weight: 600; font-size: 12.5px; }
  .space .zh { font-size: 12.5px; }
  .space .sub { font-size: 11.5px; color: var(--muted); }
  .space .goods { font-size: 13px; }
  .space.taken { opacity: .5; }
  .space.avail:hover { background: var(--hover); }
  .space .worker { font-size: 12px; color: var(--accent); font-weight: 700; }
  .upcoming { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.7; }

  /* ---------- farmyard ---------- */
  .farmwrap { display: flex; justify-content: center; padding: 6px 0 2px; }
  .farm { position: relative; }
  .tile {
    position: absolute; border: 1px solid var(--line); border-radius: 3px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; font-size: 12px; overflow: hidden; background: var(--grass); cursor: default;
  }
  .tile .glyph { font-size: 20px; line-height: 1; }
  .tile .cap { font-size: 10.5px; color: var(--ink); opacity: .75; }
  .tile.room { background: var(--wall); }
  .tile.field { background: var(--soil); }
  .tile.pasture { background: var(--grass-in); }
  .tile.pick { cursor: pointer; box-shadow: inset 0 0 0 3px var(--accent); }
  .tile.pick:hover { filter: brightness(1.08); }
  .edge { position: absolute; border-radius: 2px; background: transparent; }
  .edge.on { background: var(--fence); }
  .edge.pick { cursor: pointer; background: rgba(122, 90, 46, .22); }
  .edge.pick:hover { background: var(--fence); opacity: .8; }
  .edge.new { background: var(--accent); }

  .supply { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 9px; font-size: 13px; white-space: nowrap;
  }
  .chip b { font-weight: 700; }

  /* ---------- action panel ---------- */
  .panel { border: 1px dashed var(--accent); border-radius: 10px; padding: 10px 11px; margin-top: 10px; background: var(--rnd-tint); }
  .panel h3 { font-size: 13.5px; margin-bottom: 6px; }
  .panel p { margin: 4px 0; font-size: 12.5px; }

  /* ---------- cards ---------- */
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .cardlist { display: flex; flex-direction: column; gap: 7px; max-height: 340px; overflow-y: auto; }
  .card {
    border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 8px;
    padding: 7px 9px; background: var(--bg);
  }
  .card.occ { border-left-color: var(--occ-frame); background: var(--occ-tint); }
  .card.min { border-left-color: var(--min-frame); background: var(--min-tint); }
  .card.maj { border-left-color: var(--maj-frame); background: var(--maj-tint); }
  .card .hd { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .card .nm { font-weight: 700; font-size: 13px; }
  .card .tx { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .card .ft { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; }
  .vp { background: var(--vp-bg); color: #fff; border-radius: 999px; padding: 1px 7px; font-size: 11px; }

  table.score { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.score td { padding: 3px 6px; border-bottom: 1px solid var(--line); }
  table.score td:nth-child(2), table.score td:nth-child(3) { text-align: right; width: 52px; }
  table.score tr.tot td { font-weight: 700; border-bottom: none; font-size: 15px; }

  .log { font-size: 12px; color: var(--muted); max-height: 220px; overflow-y: auto; line-height: 1.65; }
  .adj { display: grid; grid-template-columns: repeat(auto-fill, minmax(134px, 1fr)); gap: 5px; }
  .adj .unit { display: flex; align-items: center; gap: 4px; font-size: 12.5px; white-space: nowrap; }
  .adj button { padding: 1px 7px; line-height: 1.3; }
</style>
</head>
<body>
<header class="site">
  <h1>AGRICOLA<small>1–2 PLAYER · REVISED EDITION 2016</small></h1>
  <div class="status" id="status"></div>
  <div style="margin-left:auto" class="row">
    <button id="new1">新遊戲 · 1 人</button>
    <button id="new2">新遊戲 · 2 人</button>
    <button id="theme">🌓</button>
  </div>
</header>

<main>
  <div>
    <section class="box">
      <h2>行動格 Action spaces</h2>
      <div class="spaces" id="spaces"></div>
      <div class="upcoming" id="upcoming"></div>
    </section>
    <section class="box">
      <h2>紀錄 Log</h2>
      <div class="log" id="log"></div>
    </section>
  </div>

  <div>
    <section class="box">
      <h2 id="farmTitle">農場 Farmyard</h2>
      <div class="row" id="farmTabs"></div>
      <div class="farmwrap"><div class="farm" id="farm"></div></div>
      <div class="supply" id="supply"></div>
      <div id="panel"></div>
    </section>
    <section class="box">
      <h2>手動調整 Manual adjust</h2>
      <p class="muted" style="margin:0 0 8px; font-size:12px">卡片效果唔會自動結算，用呢度加減物資。</p>
      <div class="adj" id="adjust"></div>
    </section>
  </div>

  <div>
    <section class="box">
      <h2>卡片 Cards</h2>
      <div class="tabs" id="cardTabs"></div>
      <div class="cardlist" id="cards"></div>
    </section>
    <section class="box">
      <h2>計分 Score</h2>
      <div id="score"></div>
    </section>
  </div>
</main>

<script src="../data.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
